name: Contributor agreement

# Asks each new contributor to sign the contributor licence agreement by
# posting a comment on their pull request, and records signatures on the
# cla-signatures branch. It never checks out or runs code from the pull request.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  agreement:
    runs-on: ubuntu-latest
    steps:
      - name: Check signatures
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # v2.6.1, pinned to its commit.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: 'https://gist.github.com/gemglobalventures/b4a6b846ea644b32fcfccd23dd57ee3e'
          path-to-signatures: 'signatures/version2/cla.json'
          branch: 'cla-signatures'
          allowlist: gemglobalventures,gberg,dependabot[bot]
          create-file-commit-message: 'Create the contributor agreement signature file'
          signed-commit-message: '$contributorName signed the contributor agreement in $owner/$repo#$pullRequestNo'
